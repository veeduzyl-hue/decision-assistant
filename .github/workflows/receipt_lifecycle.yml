name: Receipt Lifecycle Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  receipt-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx tsx scripts/verify_receipt_lifecycle.ts
